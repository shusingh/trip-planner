<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock A — Atlas (map-first)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16243a;
    --ink-soft: #51617a;
    --paper: #fbfaf7;
    --panel: #ffffff;
    --line: #e5e2da;
    --accent: #e07a3f;      /* saffron — route/pin colour */
    --accent-deep: #1d3557; /* expedition blue */
    --ok: #2f7d5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--ink); background: var(--paper); height: 100vh; overflow: hidden; }

  .app { display: grid; grid-template-columns: 460px 1fr; height: 100vh; }

  /* ---------- left panel ---------- */
  .panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; }
  .panel-head { padding: 22px 28px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; }
  .brand { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .brand span { color: var(--accent); }
  .step-dots { display: flex; gap: 6px; }
  .step-dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
  .step-dots i.on { background: var(--accent-deep); }

  .panel-body { padding: 30px 28px; flex: 1; }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  h1 { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 22px; }

  .field { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; background: #fff; transition: border-color .2s; }
  .field:focus-within { border-color: var(--accent-deep); }
  .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 3px; }
  .field input { border: none; outline: none; font: 500 16px 'Inter', sans-serif; color: var(--ink); width: 100%; background: transparent; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; user-select: none; background: #fff; transition: all .15s; }
  .chip:hover { border-color: var(--accent-deep); }
  .chip.on { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; }
  .btn { font: 600 15px 'Inter', sans-serif; border: none; border-radius: 999px; padding: 12px 26px; cursor: pointer; transition: all .15s; }
  .btn-primary { background: var(--accent-deep); color: #fff; }
  .btn-primary:hover { background: #274a77; }
  .btn-ghost { background: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { color: var(--ink); }

  .hint { font-size: 13px; color: var(--ink-soft); margin-top: 14px; line-height: 1.5; }

  /* loading */
  .loading { text-align: center; padding: 60px 0; }
  .compass { font-size: 44px; display: inline-block; animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { margin-top: 18px; font-family: 'Fraunces', serif; font-size: 18px; color: var(--ink-soft); min-height: 24px; }

  /* results rail */
  .rail-head { padding: 20px 28px 6px; }
  .rail-head .kicker { margin-bottom: 4px; }
  .rail-head h2 { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; }
  .rail-head .meta { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .cat-tabs { display: flex; gap: 6px; padding: 14px 28px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 5; }
  .cat-tab { font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--ink-soft); }
  .cat-tab.on { background: #eef2f7; color: var(--accent-deep); }
  .cards { padding: 12px 20px 40px; }
  .card { display: flex; gap: 14px; padding: 14px; border-radius: 14px; cursor: pointer; transition: background .15s; }
  .card:hover, .card.active { background: #f4f1ea; }
  .card .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 13px 'Inter'; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .card.food .num { background: var(--ok); }
  .card.other .num { background: var(--accent-deep); }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .card p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.45; }
  .card a { font-size: 12.5px; color: var(--accent-deep); font-weight: 600; text-decoration: none; }

  /* ---------- map ---------- */
  .map-wrap { position: relative; }
  #map { height: 100%; width: 100%; background: #dfe8ec; }
  .map-veil { position: absolute; inset: 0; z-index: 400; background: linear-gradient(120deg, rgba(29,53,87,.88), rgba(29,53,87,.65)); display: flex; align-items: center; justify-content: center; pointer-events: none; transition: opacity .8s; }
  .map-veil.hidden { opacity: 0; }
  .veil-inner { text-align: center; color: #fff; }
  .veil-inner .globe { font-size: 60px; }
  .veil-inner h2 { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 600; margin-top: 12px; }
  .veil-inner p { opacity: .8; margin-top: 6px; font-size: 15px; }

  .leaflet-div-pin { background: none; border: none; }
  .pin { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,.3); animation: drop .4s ease-out; }
  .pin b { transform: rotate(45deg); color: #fff; font: 700 12px 'Inter'; }
  @keyframes drop { from { transform: rotate(-45deg) translateY(-24px); opacity: 0; } }
</style>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel"></aside>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-veil" id="veil">
      <div class="veil-inner">
        <div class="globe">🧭</div>
        <h2>Where to, this time?</h2>
        <p>The map follows your plans as you type.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA = {
  destination: "Tokyo, Japan", start: "2026-10-12", end: "2026-10-16",
  center: [35.676, 139.72],
  attractions: [
    { name: "Senso-ji Temple", lat: 35.7148, lng: 139.7967, desc: "Tokyo's oldest temple, approached through the lantern of Kaminarimon and the Nakamise arcade." },
    { name: "Meiji Shrine", lat: 35.6764, lng: 139.6993, desc: "A forested Shinto sanctuary hidden in the middle of the city, beside Harajuku." },
    { name: "teamLab Planets", lat: 35.6494, lng: 139.7885, desc: "Barefoot, waist-deep digital art. Book ahead; go at opening for thin crowds." },
    { name: "Shibuya Crossing & Sky", lat: 35.6595, lng: 139.7005, desc: "The famous scramble, best watched from the Shibuya Sky deck at dusk." }
  ],
  food: [
    { name: "Tsukiji Outer Market", lat: 35.6654, lng: 139.7707, desc: "Breakfast of tamagoyaki, uni bowls and knife-sharp street sushi." },
    { name: "Afuri Ramen, Ebisu", lat: 35.6467, lng: 139.7101, desc: "Yuzu-scented shio ramen; the ticket machine takes cash and courage." },
    { name: "Omoide Yokocho", lat: 35.6938, lng: 139.6996, desc: "Smoky alley of yakitori stalls under the Shinjuku tracks." }
  ],
  other: [
    { name: "Golden Gai", lat: 35.6944, lng: 139.7046, desc: "Two hundred matchbox bars, six seats each. Pick the one with a free stool." },
    { name: "Nakameguro Canal", lat: 35.644, lng: 139.6982, desc: "Canal-side coffee and vintage shops away from the crowds." },
    { name: "Akihabara Electric Town", lat: 35.6984, lng: 139.7731, desc: "Retro game arcades and eight-storey electronics bazaars." }
  ]
};
const TAGS = ["Must-see", "Great food", "Hidden gems", "Nightlife", "History", "Nature", "Culture", "Shopping"];
const LOADING_LINES = ["Consulting local friends…", "Reading the neighbourhood maps…", "Tasting the street food (twice)…", "Marking the good spots in ink…"];
const CAT_COLOR = { attractions: "#e07a3f", food: "#2f7d5c", other: "#1d3557" };

let map, markers = [], picked = new Set(["Must-see", "Great food"]);
const panel = document.getElementById("panel");
const veil = document.getElementById("veil");

map = L.map("map", { zoomControl: false }).setView([30, 20], 2.4);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { attribution: "© OpenStreetMap, © CARTO" }).addTo(map);
L.control.zoom({ position: "bottomright" }).addTo(map);

function head(step) {
  return `<div class="panel-head">
    <div class="brand">Trip<span>Atlas</span></div>
    <div class="step-dots">${[1,2,3].map(i => `<i class="${i<=step?'on':''}"></i>`).join("")}</div>
  </div>`;
}

function step1() {
  panel.innerHTML = head(1) + `<div class="panel-body">
    <div class="kicker">Step 1 · Destination</div>
    <h1>Where does the story begin?</h1>
    <div class="field"><label>Destination</label><input id="dest" value="${DATA.destination}" placeholder="e.g. Tokyo, Japan"></div>
    <div class="nav-row"><span></span><button class="btn btn-primary" onclick="flyToCity(); step2()">Next →</button></div>
    <p class="hint">Try typing — in the real app the map glides to each place it recognises.</p>
  </div>`;
}

function flyToCity() {
  veil.classList.add("hidden");
  map.flyTo(DATA.center, 10, { duration: 2.2 });
}

function step2() {
  panel.innerHTML = head(2) + `<div class="panel-body">
    <div class="kicker">Step 2 · Dates</div>
    <h1>And when?</h1>
    <div class="field"><label>From</label><input type="date" value="${DATA.start}"></div>
    <div class="field"><label>To</label><input type="date" value="${DATA.end}"></div>
    <div class="nav-row"><button class="btn btn-ghost" onclick="step1()">← Back</button>
    <button class="btn btn-primary" onclick="step3()">Next →</button></div>
  </div>`;
}

function step3() {
  panel.innerHTML = head(3) + `<div class="panel-body">
    <div class="kicker">Step 3 · Tastes</div>
    <h1>What kind of traveller are you?</h1>
    <div class="chips">${TAGS.map(t => `<div class="chip ${picked.has(t)?'on':''}" onclick="togglePick(this,'${t}')">${t}</div>`).join("")}</div>
    <div class="nav-row"><button class="btn btn-ghost" onclick="step2()">← Back</button>
    <button class="btn btn-primary" onclick="loading()">Chart my trip ✦</button></div>
  </div>`;
}

function togglePick(el, t) { el.classList.toggle("on"); picked.has(t) ? picked.delete(t) : picked.add(t); }

function loading() {
  panel.innerHTML = head(3) + `<div class="panel-body loading">
    <span class="compass">🧭</span><p id="loadline">${LOADING_LINES[0]}</p></div>`;
  let i = 0;
  const iv = setInterval(() => {
    i++;
    if (i >= LOADING_LINES.length) { clearInterval(iv); results(); return; }
    document.getElementById("loadline").textContent = LOADING_LINES[i];
  }, 900);
}

function results() {
  const groups = [["attractions","Attractions"],["food","Food"],["other","Local finds"]];
  panel.innerHTML = head(3) + `
    <div class="rail-head">
      <div class="kicker">Your itinerary sketch</div>
      <h2>${DATA.destination}</h2>
      <div class="meta">Oct 12 – 16 · ${[...picked].join(" · ")}</div>
    </div>
    <div class="cat-tabs">${groups.map(([k,l],i) => `<div class="cat-tab ${i===0?'on':''}" onclick="showCat('${k}',this)">${l}</div>`).join("")}
    </div>
    <div class="cards" id="cards"></div>`;
  showCat("attractions", document.querySelector(".cat-tab"));
  plotAll();
}

function showCat(cat, tab) {
  document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("on"));
  if (tab) tab.classList.add("on");
  document.getElementById("cards").innerHTML = DATA[cat].map((p, i) => `
    <div class="card ${cat}" id="card-${cat}-${i}" onclick="focusPlace('${cat}',${i})">
      <div class="num">${i+1}</div>
      <div><h3>${p.name}</h3><p>${p.desc}</p><a href="#">Open in Maps ↗</a></div>
    </div>`).join("");
}

function plotAll() {
  markers.forEach(m => map.removeLayer(m)); markers = [];
  let delay = 0;
  for (const cat of ["attractions","food","other"]) {
    DATA[cat].forEach((p, i) => {
      setTimeout(() => {
        const icon = L.divIcon({ className: "leaflet-div-pin", html: `<div class="pin" style="background:${CAT_COLOR[cat]}"><b>${i+1}</b></div>`, iconSize: [30,30], iconAnchor: [15,30] });
        const m = L.marker([p.lat, p.lng], { icon }).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.desc}`);
        m._cat = cat; m._idx = i; markers.push(m);
      }, delay += 140);
    });
  }
  map.flyToBounds(L.latLngBounds(Object.values(DATA).flat().filter(p => p.lat).map(p => [p.lat, p.lng])).pad(0.2), { duration: 1.6 });
}

function focusPlace(cat, i) {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
  document.getElementById(`card-${cat}-${i}`).classList.add("active");
  const p = DATA[cat][i];
  map.flyTo([p.lat, p.lng], 14, { duration: 1.1 });
  const m = markers.find(m => m._cat === cat && m._idx === i);
  if (m) setTimeout(() => m.openPopup(), 1100);
}

step1();
</script>
</body>
</html>
