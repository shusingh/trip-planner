<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock C — Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --ink: #141414;
    --grey: #6d6a63;
    --blue: #2727e6;   /* Klein blue accent */
    --line: #dcd8cf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--ink); }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 5vw; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .topbar .logo { font-family: 'Fraunces', serif; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .topbar .logo em { color: var(--blue); font-style: italic; }
  .topbar .issue { font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: var(--grey); }

  /* hero */
  .hero { padding: 9vh 5vw 8vh; border-bottom: 1px solid var(--line); }
  .hero .rubric { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--blue); margin-bottom: 22px; }
  .hero h1 { font-family: 'Fraunces', serif; font-weight: 800; font-size: clamp(48px, 9vw, 110px); line-height: .98; letter-spacing: -0.03em; max-width: 12ch; }
  .hero h1 em { font-style: italic; font-weight: 400; color: var(--blue); }
  .hero .dek { max-width: 46ch; font-size: 18px; line-height: 1.55; color: var(--grey); margin-top: 26px; }
  .hero .cta { margin-top: 36px; display: inline-flex; align-items: center; gap: 14px; font-weight: 600; font-size: 15px; letter-spacing: .04em; cursor: pointer; border: none; background: var(--ink); color: var(--bg); padding: 18px 34px; border-radius: 999px; transition: background .2s; }
  .hero .cta:hover { background: var(--blue); }

  /* wizard as interview */
  .interview { padding: 0 5vw; }
  .q { display: grid; grid-template-columns: 120px 1fr; gap: 4vw; padding: 7vh 0; border-bottom: 1px solid var(--line); align-items: start; }
  .q .no { font-family: 'Fraunces', serif; font-size: 80px; font-weight: 800; color: transparent; -webkit-text-stroke: 1.5px var(--ink); line-height: 1; }
  .q.done .no { color: var(--blue); -webkit-text-stroke: 0; }
  .q h2 { font-family: 'Fraunces', serif; font-size: clamp(26px, 3.4vw, 40px); font-weight: 600; letter-spacing: -0.02em; margin-bottom: 24px; }
  .q h2 em { font-style: italic; color: var(--blue); }

  .blank { display: inline-block; border: none; border-bottom: 3px solid var(--ink); background: transparent; outline: none; font: italic 400 clamp(26px,3.4vw,40px) 'Fraunces', serif; color: var(--blue); width: 380px; max-width: 80vw; padding-bottom: 2px; }
  .datepair { display: flex; gap: 24px; flex-wrap: wrap; }
  .datepair input { border: none; border-bottom: 3px solid var(--ink); background: transparent; outline: none; font: 500 22px 'Space Grotesk'; color: var(--blue); padding-bottom: 6px; }

  .words { display: flex; flex-wrap: wrap; gap: 10px 14px; max-width: 700px; }
  .word { font-family: 'Fraunces', serif; font-size: 24px; font-style: italic; cursor: pointer; user-select: none; color: var(--grey); transition: color .15s; padding: 2px 4px; }
  .word:hover { color: var(--ink); }
  .word.on { color: var(--blue); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }

  .go-row { padding: 6vh 0 10vh; text-align: center; }
  .go { font: 600 16px 'Space Grotesk'; letter-spacing: .06em; background: var(--blue); color: #fff; border: none; border-radius: 999px; padding: 20px 46px; cursor: pointer; transition: transform .15s, background .2s; }
  .go:hover { transform: scale(1.04); background: var(--ink); }

  /* loading */
  .press { text-align: center; padding: 16vh 5vw; }
  .press h2 { font-family: 'Fraunces', serif; font-size: clamp(30px, 5vw, 54px); font-weight: 800; }
  .press h2 span { display: inline-block; animation: rollup 1.4s ease infinite; }
  @keyframes rollup { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }
  .press p { color: var(--grey); margin-top: 16px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }

  /* results spread */
  .spread { padding: 8vh 5vw 12vh; }
  .spread .rubric { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--blue); }
  .spread h1 { font-family: 'Fraunces', serif; font-size: clamp(44px, 7vw, 88px); font-weight: 800; letter-spacing: -0.03em; margin: 14px 0 6px; }
  .spread .standfirst { color: var(--grey); font-size: 16px; margin-bottom: 8vh; }

  .cat { margin-bottom: 9vh; }
  .cat-head { display: flex; align-items: baseline; gap: 22px; border-bottom: 3px solid var(--ink); padding-bottom: 12px; margin-bottom: 0; }
  .cat-head .idx { font-family: 'Fraunces', serif; font-style: italic; font-size: 22px; color: var(--blue); }
  .cat-head h2 { font-family: 'Fraunces', serif; font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: -0.02em; }

  .entry { display: grid; grid-template-columns: 90px 1fr auto; gap: 3vw; padding: 34px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .entry .n { font-family: 'Fraunces', serif; font-size: 44px; font-weight: 800; color: transparent; -webkit-text-stroke: 1.2px var(--ink); }
  .entry:hover .n { color: var(--blue); -webkit-text-stroke: 0; }
  .entry h3 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin-bottom: 8px; }
  .entry p { color: var(--grey); line-height: 1.6; font-size: 15.5px; max-width: 62ch; }
  .entry a { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); text-decoration: none; white-space: nowrap; border-bottom: 2px solid var(--blue); padding-bottom: 3px; }
  .entry a:hover { color: var(--blue); }

  footer { border-top: 1px solid var(--line); padding: 30px 5vw; display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--grey); }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">The <em>Wander</em> Press</div>
  <div class="issue">Vol. II — Your Private Issue</div>
</div>

<div id="stage"></div>

<footer><span>Made with ♥ by Shubham Singh</span><span>AI-assisted, human-approved</span></footer>

<script>
const TAGS = ["must-sees", "great food", "hidden gems", "nightlife", "history", "nature", "culture", "shopping"];
const DATA = {
  attractions: [
    { name: "Senso-ji Temple", desc: "Tokyo's oldest temple, approached through the great lantern of Kaminarimon and the souvenir gauntlet of Nakamise-dori. Go before eight in the morning and you will have the incense to yourself." },
    { name: "Meiji Shrine", desc: "A hundred-year-old forest hiding a Shinto sanctuary in the middle of the city. The gravel crunch does half the meditating for you." },
    { name: "teamLab Planets", desc: "Barefoot, waist-deep digital art in Toyosu. Book ahead; the water mirrors are worth every yen." }
  ],
  food: [
    { name: "Tsukiji Outer Market", desc: "Breakfast of tamagoyaki on a stick, uni bowls, and street sushi cut with terrifying precision." },
    { name: "Afuri Ramen, Ebisu", desc: "Yuzu-scented shio ramen in a broth light enough to justify a second bowl. The ticket machine takes cash and courage." },
    { name: "Omoide Yokocho", desc: "A smoky lantern-lit alley of yakitori stalls under the Shinjuku tracks. Order the tsukune, thank us later." }
  ],
  other: [
    { name: "Golden Gai", desc: "Two hundred matchbox bars, six seats apiece. The etiquette: pick the one whose regulars smile back." },
    { name: "Nakameguro Canal", desc: "Canal-side coffee, vintage shops, and the city at its most unhurried." },
    { name: "Akihabara Electric Town", desc: "Retro game arcades stacked eight storeys high; bring coins and abandon dignity." }
  ]
};
const stage = document.getElementById("stage");
let picked = new Set(["must-sees", "great food"]);

function landing() {
  stage.innerHTML = `
    <section class="hero">
      <div class="rubric">The itinerary desk · est. 2024</div>
      <h1>Every great trip begins as a <em>rough draft.</em></h1>
      <p class="dek">Tell us where, when, and what moves you. Our AI correspondents file a personalised dispatch: the landmarks, the tables worth booking, and the corners guidebooks miss.</p>
      <button class="cta" onclick="interview()">Draft my trip →</button>
    </section>`;
}

function interview() {
  stage.innerHTML = `
    <section class="interview">
      <div class="q" id="q1">
        <div class="no">01</div>
        <div><h2>This season, I am going to <input class="blank" id="dest" value="Tokyo, Japan" onblur="mark('q1')"></h2></div>
      </div>
      <div class="q" id="q2">
        <div class="no">02</div>
        <div>
          <h2>between <em>these dates</em></h2>
          <div class="datepair">
            <input type="date" value="2026-10-12" onchange="mark('q2')">
            <input type="date" value="2026-10-16" onchange="mark('q2')">
          </div>
        </div>
      </div>
      <div class="q" id="q3">
        <div class="no">03</div>
        <div>
          <h2>and I am chasing <em>(underline all that apply)</em></h2>
          <div class="words">${TAGS.map(t => `<span class="word ${picked.has(t)?'on':''}" onclick="toggleWord(this,'${t}')">${t}</span>`).join("")}</div>
        </div>
      </div>
      <div class="go-row"><button class="go" onclick="press()">Send it to press ✦</button></div>
    </section>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function mark(id) { document.getElementById(id).classList.add("done"); }
function toggleWord(el, t) { el.classList.toggle("on"); picked.has(t) ? picked.delete(t) : picked.add(t); mark('q3'); }

function press() {
  stage.innerHTML = `
    <section class="press">
      <h2>${"Printing your issue…".split("").map((c,i) => `<span style="animation-delay:${i*0.05}s">${c === " " ? "&nbsp;" : c}</span>`).join("")}</h2>
      <p id="pline">Interviewing the locals</p>
    </section>`;
  const lines = ["Interviewing the locals", "Fact-checking the ramen", "Setting the headlines in type"];
  let i = 0;
  const iv = setInterval(() => {
    i++;
    if (i >= lines.length) { clearInterval(iv); spread(); return; }
    document.getElementById("pline").textContent = lines[i];
  }, 900);
}

function spread() {
  const cat = (idx, title, key) => `
    <div class="cat">
      <div class="cat-head"><span class="idx">${idx}</span><h2>${title}</h2></div>
      ${DATA[key].map((p, i) => `
        <div class="entry">
          <div class="n">${String(i+1).padStart(2,"0")}</div>
          <div><h3>${p.name}</h3><p>${p.desc}</p></div>
          <a href="#">View on map</a>
        </div>`).join("")}
    </div>`;
  stage.innerHTML = `
    <section class="spread">
      <div class="rubric">Your private issue · Oct 12–16 · ${[...picked].join(", ")}</div>
      <h1>Tokyo, Japan</h1>
      <p class="standfirst">Nine dispatches from our correspondents, chosen for your tastes.</p>
      ${cat("i.", "The Landmarks", "attractions")}
      ${cat("ii.", "The Tables", "food")}
      ${cat("iii.", "The Margins", "other")}
      <div class="go-row"><button class="go" onclick="landing()">Draft another issue</button></div>
    </section>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

landing();
</script>
</body>
</html>
