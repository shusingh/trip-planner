<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock B — Boarding Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f0e4;
    --card: #fdfaf1;
    --navy: #14213d;
    --navy-soft: #5a6478;
    --stamp: #b7462c;
    --line: #d8d0bc;
    --gold: #c99b3f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Mono', monospace; background: var(--paper); color: var(--navy);
    min-height: 100vh; padding: 48px 20px 80px;
    background-image: radial-gradient(circle at 15% 20%, rgba(183,70,44,.05), transparent 40%),
                      radial-gradient(circle at 85% 80%, rgba(20,33,61,.05), transparent 40%);
  }
  .masthead { text-align: center; margin-bottom: 36px; }
  .masthead .airline { font-size: 12px; letter-spacing: .4em; text-transform: uppercase; color: var(--navy-soft); }
  .masthead h1 { font-family: 'Fraunces', serif; font-size: 42px; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; }
  .masthead h1 em { font-style: italic; color: var(--stamp); }

  /* --- the pass --- */
  .pass { max-width: 760px; margin: 0 auto; filter: drop-shadow(0 14px 24px rgba(20,33,61,.16)); }
  .pass-inner { background: var(--card); border-radius: 16px; overflow: hidden; position: relative; }
  .pass-top { background: var(--navy); color: var(--card); padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
  .pass-top .lights { display: flex; gap: 8px; }
  .pass-top .lights i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .pass-top .lights i.on { background: var(--gold); }

  .pass-body { padding: 34px 40px 30px; }
  .route { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; }
  .route .code { font-family: 'Fraunces', serif; font-size: 52px; font-weight: 700; line-height: 1; }
  .route .code small { display: block; font-family: 'IBM Plex Mono'; font-size: 11px; font-weight: 400; letter-spacing: .12em; color: var(--navy-soft); margin-top: 6px; text-transform: uppercase; }
  .route .plane { flex: 1; text-align: center; color: var(--navy-soft); font-size: 13px; position: relative; }
  .route .plane::before, .route .plane::after { content: ""; position: absolute; top: 50%; width: 40%; border-top: 2px dashed var(--line); }
  .route .plane::before { left: 0; } .route .plane::after { right: 0; }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .f { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 16px; }
  .f label { display: block; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--navy-soft); margin-bottom: 4px; }
  .f input { border: none; outline: none; background: transparent; font: 500 16px 'IBM Plex Mono'; color: var(--navy); width: 100%; }
  .f.wide { grid-column: 1 / -1; }

  .stamps-title { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--navy-soft); margin: 24px 0 12px; }
  .stamps { display: flex; flex-wrap: wrap; gap: 12px; }
  .stamp {
    border: 2px solid var(--navy); border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; cursor: pointer; user-select: none;
    transform: rotate(var(--tilt, 0deg)); transition: all .15s; background: #fff; color: var(--navy);
  }
  .stamp:hover { transform: rotate(var(--tilt, 0deg)) scale(1.05); }
  .stamp.on { border-color: var(--stamp); color: var(--stamp); background: rgba(183,70,44,.06); box-shadow: inset 0 0 0 1px rgba(183,70,44,.35); }
  .stamp.on::after { content: " ✓"; }

  /* perforation & stub */
  .perf { position: relative; border-top: 2px dashed var(--line); margin: 30px -40px 0; }
  .perf::before, .perf::after { content: ""; position: absolute; top: -13px; width: 26px; height: 26px; border-radius: 50%; background: var(--paper); }
  .perf::before { left: -13px; } .perf::after { right: -13px; }
  .stub { padding: 22px 40px 26px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .barcode { flex: 1; height: 44px; background: repeating-linear-gradient(90deg, var(--navy) 0 2px, transparent 2px 5px, var(--navy) 5px 6px, transparent 6px 10px); border-radius: 2px; opacity: .85; }
  .btn {
    font: 600 14px 'IBM Plex Mono'; letter-spacing: .1em; text-transform: uppercase;
    background: var(--stamp); color: #fff; border: none; border-radius: 8px; padding: 14px 26px; cursor: pointer; transition: all .15s;
  }
  .btn:hover { background: #99361f; }
  .btn.ghost { background: transparent; color: var(--navy-soft); padding: 14px 10px; }
  .btn.ghost:hover { color: var(--navy); }

  /* loading = customs stamping */
  .customs { text-align: center; padding: 70px 30px; }
  .customs .big { font-size: 54px; animation: thunk 1s ease-in-out infinite; display: inline-block; }
  @keyframes thunk { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-16px) rotate(3deg);} }
  .customs p { margin-top: 18px; color: var(--navy-soft); font-size: 14px; letter-spacing: .06em; }

  /* --- itinerary folio --- */
  .folio { max-width: 760px; margin: 0 auto; }
  .folio-head { text-align: center; margin-bottom: 30px; }
  .folio-head .ok-stamp {
    display: inline-block; border: 3px solid var(--stamp); color: var(--stamp); border-radius: 10px;
    font-weight: 700; letter-spacing: .25em; text-transform: uppercase; padding: 10px 22px; font-size: 14px;
    transform: rotate(-6deg); margin-bottom: 18px; background: rgba(183,70,44,.04);
  }
  .folio-head h2 { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 700; }
  .folio-head p { color: var(--navy-soft); font-size: 13px; margin-top: 6px; letter-spacing: .08em; }

  .section-tag { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--navy-soft); margin: 34px 4px 14px; display: flex; align-items: center; gap: 14px; }
  .section-tag::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

  .tag-card {
    background: var(--card); border-radius: 12px; padding: 20px 24px 20px 20px; margin-bottom: 14px;
    display: flex; gap: 18px; align-items: flex-start; position: relative;
    box-shadow: 0 4px 12px rgba(20,33,61,.08); border-left: 6px solid var(--navy);
  }
  .tag-card.food { border-left-color: var(--stamp); }
  .tag-card.other { border-left-color: var(--gold); }
  .tag-card .hole { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 3px rgba(0,0,0,.2); margin-top: 5px; }
  .tag-card h3 { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 700; margin-bottom: 5px; }
  .tag-card p { font-size: 13.5px; line-height: 1.55; color: var(--navy-soft); }
  .tag-card .coords { font-size: 11px; letter-spacing: .1em; color: var(--gold); margin-top: 8px; display: block; }
  .tag-card a { color: var(--stamp); font-size: 12px; text-decoration: none; font-weight: 600; }

  .again { text-align: center; margin-top: 40px; }
  footer { text-align: center; margin-top: 60px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--navy-soft); }
</style>
</head>
<body>
<div class="masthead">
  <div class="airline">✈ Shubham Air · First Class Planning</div>
  <h1>Your <em>boarding pass</em> to anywhere</h1>
</div>

<div id="stage"></div>
<footer>Made with ♥ by Shubham Singh · Gate 42</footer>

<script>
const TAGS = ["Must-see", "Food", "Hidden gems", "Nightlife", "History", "Nature", "Culture", "Shopping"];
const DATA = {
  attractions: [
    { name: "Senso-ji Temple", desc: "Tokyo's oldest temple, approached through the great lantern of Kaminarimon and the Nakamise arcade.", coords: "35.7148° N, 139.7967° E" },
    { name: "Meiji Shrine", desc: "A forested Shinto sanctuary hidden in the middle of the city, right beside Harajuku.", coords: "35.6764° N, 139.6993° E" },
    { name: "teamLab Planets", desc: "Barefoot, waist-deep digital art. Book ahead and go at opening for thin crowds.", coords: "35.6494° N, 139.7885° E" }
  ],
  food: [
    { name: "Tsukiji Outer Market", desc: "Breakfast of tamagoyaki, uni bowls and knife-sharp street sushi.", coords: "35.6654° N, 139.7707° E" },
    { name: "Afuri Ramen, Ebisu", desc: "Yuzu-scented shio ramen; the ticket machine takes cash and courage.", coords: "35.6467° N, 139.7101° E" },
    { name: "Omoide Yokocho", desc: "A smoky alley of yakitori stalls tucked under the Shinjuku train tracks.", coords: "35.6938° N, 139.6996° E" }
  ],
  other: [
    { name: "Golden Gai", desc: "Two hundred matchbox bars, six seats each. Pick the one with a free stool.", coords: "35.6944° N, 139.7046° E" },
    { name: "Nakameguro Canal", desc: "Canal-side coffee and vintage shops away from the crowds.", coords: "35.6440° N, 139.6982° E" }
  ]
};
const stage = document.getElementById("stage");
let picked = new Set(["Must-see", "Food"]);

function passShell(step, inner) {
  return `<div class="pass"><div class="pass-inner">
    <div class="pass-top">
      <span>Boarding pass · Step ${step} of 3</span>
      <div class="lights">${[1,2,3].map(i => `<i class="${i<=step?'on':''}"></i>`).join("")}</div>
    </div>
    ${inner}
  </div></div>`;
}

function step1() {
  stage.innerHTML = passShell(1, `
    <div class="pass-body">
      <div class="route">
        <div class="code">HOME<small>Origin · anywhere</small></div>
        <div class="plane">✈</div>
        <div class="code" style="color:var(--stamp)">TYO<small>Destination</small></div>
      </div>
      <div class="fields">
        <div class="f wide"><label>Destination</label><input value="Tokyo, Japan" placeholder="e.g. Paris, France"></div>
      </div>
    </div>
    <div class="perf"></div>
    <div class="stub"><div class="barcode"></div><button class="btn" onclick="step2()">Next →</button></div>
  `);
}

function step2() {
  stage.innerHTML = passShell(2, `
    <div class="pass-body">
      <div class="fields">
        <div class="f"><label>Departure</label><input type="date" value="2026-10-12"></div>
        <div class="f"><label>Return</label><input type="date" value="2026-10-16"></div>
        <div class="f"><label>Seat</label><input value="Window, always" readonly></div>
        <div class="f"><label>Class</label><input value="Adventure" readonly></div>
      </div>
    </div>
    <div class="perf"></div>
    <div class="stub"><button class="btn ghost" onclick="step1()">← Back</button><div class="barcode"></div><button class="btn" onclick="step3()">Next →</button></div>
  `);
}

function step3() {
  const tilts = [-2, 1.5, -1, 2, -1.5, 1, -2.5, 2];
  stage.innerHTML = passShell(3, `
    <div class="pass-body">
      <div class="stamps-title">Stamp your interests — like a well-travelled passport</div>
      <div class="stamps">${TAGS.map((t,i) => `<div class="stamp ${picked.has(t)?'on':''}" style="--tilt:${tilts[i]}deg" onclick="togglePick(this,'${t}')">${t}</div>`).join("")}</div>
    </div>
    <div class="perf"></div>
    <div class="stub"><button class="btn ghost" onclick="step2()">← Back</button><div class="barcode"></div><button class="btn" onclick="customs()">Board ✈</button></div>
  `);
}

function togglePick(el, t) { el.classList.toggle("on"); picked.has(t) ? picked.delete(t) : picked.add(t); }

function customs() {
  stage.innerHTML = passShell(3, `
    <div class="customs">
      <span class="big">🛂</span>
      <p id="cline">Customs is stamping your itinerary…</p>
    </div>`);
  const lines = ["Customs is stamping your itinerary…", "Checking the good ramen lists…", "Approving late-night plans…"];
  let i = 0;
  const iv = setInterval(() => {
    i++;
    if (i >= lines.length) { clearInterval(iv); folio(); return; }
    document.getElementById("cline").textContent = lines[i];
  }, 900);
}

function folio() {
  const sect = (key, label, cls) => `
    <div class="section-tag">${label}</div>
    ${DATA[key].map(p => `
      <div class="tag-card ${cls}">
        <div class="hole"></div>
        <div>
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <span class="coords">${p.coords} · <a href="#">Open in Maps ↗</a></span>
        </div>
      </div>`).join("")}`;
  stage.innerHTML = `<div class="folio">
    <div class="folio-head">
      <div class="ok-stamp">Approved ✈ TYO</div>
      <h2>Tokyo, Japan</h2>
      <p>OCT 12 — OCT 16 · ${[...picked].join(" · ").toUpperCase()}</p>
    </div>
    ${sect("attractions", "Luggage tag one · Attractions", "")}
    ${sect("food", "Luggage tag two · Where to eat", "food")}
    ${sect("other", "Luggage tag three · Local finds", "other")}
    <div class="again"><button class="btn" onclick="step1()">Plan another trip</button></div>
  </div>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

step1();
</script>
</body>
</html>
